name: C++ Build with MSVC

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build-windows-msvc:
    name: Windows MSVC ${{ matrix.platform }}-${{ matrix.build_type }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
        platform: [x64, x86]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.platform == 'x86' && 'x86' || 'amd64' }}

    - name: Configure CMake (Ninja Generator)
      env:
        CMAKE_GENERATOR: Ninja
      run: |
        cmake -B ${{ github.workspace }}/build `
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
          -G "Ninja" `
          -DCMAKE_C_COMPILER=cl.exe `
          -DCMAKE_CXX_COMPILER=cl.exe

    - name: Build project
      run: cmake --build ${{ github.workspace }}/build --config ${{ matrix.build_type }} --parallel

    - name: Run tests (if available)
      working-directory: ${{ github.workspace }}/build
      run: ctest --output-on-failure
      continue-on-error: true

    - name: Upload build artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: demo-${{ matrix.platform }}-${{ matrix.build_type }}
        path: |
          ${{ github.workspace }}/build/*.exe
        retention-days: 7
